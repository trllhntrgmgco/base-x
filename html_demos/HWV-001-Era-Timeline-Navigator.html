<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HWV-001: Era Timeline Navigator — Base-X Game Engine</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap');

:root {
  --parchment: #f5ead6;
  --parchment-deep: #e8d5b5;
  --ink: #1a1410;
  --ink-soft: #3d3128;
  --ink-faded: #7a6e5e;
  --gold: #c9a84c;
  --gold-bright: #e8c84c;
  --gold-dim: #8a7a3c;
  --copper: #b87333;
  --verdigris: #43b3ae;
  --blood: #8b2500;
  --royal: #2c1654;
  --timeline-track: rgba(201,168,76,0.3);
  --card-bg: rgba(245,234,214,0.92);
  --overlay: rgba(26,20,16,0.85);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--ink);
  color: var(--parchment);
  font-family: 'Crimson Pro', Georgia, serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  cursor: default;
}

/* AGED PAPER TEXTURE */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(201,168,76,0.04), transparent 60%),
    radial-gradient(ellipse at 70% 80%, rgba(184,115,51,0.03), transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* HEADER BAR */
.header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 52px;
  background: linear-gradient(180deg, rgba(26,20,16,0.97), rgba(26,20,16,0.88));
  border-bottom: 1px solid var(--gold-dim);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  z-index: 100;
}

.header-left { display: flex; align-items: center; gap: 14px; }

.demo-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  color: var(--ink);
  background: var(--gold);
  padding: 2px 8px;
  letter-spacing: 2px;
}

.demo-title {
  font-family: 'Cinzel', serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: 3px;
}

.header-right { display: flex; align-items: center; gap: 18px; }

.engine-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--ink-faded);
  letter-spacing: 1px;
}

.copyright {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  color: var(--gold-dim);
}

/* DRO INDICATOR */
.dro-strip {
  position: fixed;
  top: 52px; left: 0; right: 0;
  height: 28px;
  background: rgba(26,20,16,0.7);
  border-bottom: 1px solid rgba(201,168,76,0.12);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 20px;
  z-index: 99;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
}

.dro-item { display: flex; align-items: center; gap: 6px; }
.dro-label { color: var(--ink-faded); letter-spacing: 1px; }
.dro-val { color: var(--gold-bright); font-weight: 500; }

/* MAIN AREA */
.main {
  position: fixed;
  top: 80px; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  z-index: 1;
}

/* ERA NAV BAR */
.era-nav {
  height: 48px;
  display: flex;
  align-items: stretch;
  border-bottom: 2px solid var(--gold-dim);
  flex-shrink: 0;
  overflow-x: auto;
}

.era-nav::-webkit-scrollbar { height: 0; }

.era-tab {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 12px;
  background: transparent;
  border: none;
  border-right: 1px solid rgba(201,168,76,0.12);
  color: var(--ink-faded);
  font-family: 'Cinzel', serif;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
}

.era-tab:hover { color: var(--gold); background: rgba(201,168,76,0.05); }

.era-tab.active {
  color: var(--gold-bright);
  background: rgba(201,168,76,0.08);
}

.era-tab.active::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 20%;
  right: 20%;
  height: 2px;
  background: var(--gold-bright);
}

.era-tab-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--gold-dim);
  background: rgba(201,168,76,0.08);
  padding: 1px 5px;
  border-radius: 2px;
}

/* TIMELINE TRACK */
.timeline-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.timeline-strip {
  height: 80px;
  flex-shrink: 0;
  position: relative;
  background: rgba(26,20,16,0.4);
  border-bottom: 1px solid rgba(201,168,76,0.1);
  overflow: hidden;
}

.timeline-track {
  position: absolute;
  top: 38px;
  left: 40px;
  right: 40px;
  height: 3px;
  background: var(--timeline-track);
}

.timeline-marker {
  position: absolute;
  top: -12px;
  width: 2px;
  height: 28px;
  background: var(--gold-dim);
  cursor: pointer;
  transition: all 0.2s;
}

.timeline-marker:hover { background: var(--gold-bright); transform: scaleY(1.2); }
.timeline-marker.active { background: var(--gold-bright); width: 3px; }

.timeline-marker-label {
  position: absolute;
  top: -18px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  color: var(--ink-faded);
  white-space: nowrap;
}

.timeline-marker.active .timeline-marker-label { color: var(--gold-bright); }

.timeline-era-bar {
  position: absolute;
  top: 42px;
  height: 10px;
  border-radius: 2px;
  opacity: 0.4;
  transition: opacity 0.3s;
}

.timeline-era-bar.active { opacity: 0.8; }

.timeline-year-display {
  position: absolute;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Cinzel', serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 2px;
}

/* CONTENT SCROLL AREA */
.content-area {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

.content-area::-webkit-scrollbar { width: 6px; }
.content-area::-webkit-scrollbar-track { background: transparent; }
.content-area::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 3px; }

/* ERA HEADER */
.era-header {
  margin-bottom: 24px;
  animation: fadeUp 0.5s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.era-name {
  font-family: 'Cinzel', serif;
  font-size: 32px;
  font-weight: 900;
  color: var(--gold-bright);
  letter-spacing: 4px;
  margin-bottom: 4px;
}

.era-period {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--gold-dim);
  letter-spacing: 2px;
  margin-bottom: 6px;
}

.era-theme {
  font-family: 'Crimson Pro', serif;
  font-style: italic;
  font-size: 16px;
  color: var(--ink-faded);
  padding-left: 16px;
  border-left: 2px solid var(--gold-dim);
}

/* DRO ERA INFO */
.era-dro-info {
  display: flex;
  gap: 16px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.dro-chip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  padding: 3px 10px;
  border: 1px solid rgba(201,168,76,0.2);
  color: var(--gold);
  letter-spacing: 1px;
}

/* FACTION GRID */
.faction-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
  animation: fadeUp 0.6s ease;
}

/* FACTION CARD */
.faction-card {
  background: rgba(245,234,214,0.04);
  border: 1px solid rgba(201,168,76,0.15);
  padding: 0;
  cursor: pointer;
  transition: all 0.3s;
  overflow: hidden;
}

.faction-card:hover {
  border-color: var(--gold);
  background: rgba(245,234,214,0.07);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}

.faction-card.expanded {
  border-color: var(--gold-bright);
  background: rgba(245,234,214,0.08);
}

.faction-card-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
}

.faction-icon {
  font-size: 28px;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(201,168,76,0.08);
  border-radius: 4px;
  flex-shrink: 0;
}

.faction-info { flex: 1; }

.faction-name {
  font-family: 'Cinzel', serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--parchment);
  letter-spacing: 1px;
}

.faction-territory {
  font-family: 'Crimson Pro', serif;
  font-size: 12px;
  color: var(--ink-faded);
  font-style: italic;
}

.faction-bonus-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  color: var(--gold);
  background: rgba(201,168,76,0.1);
  padding: 2px 6px;
  letter-spacing: 1px;
  margin-top: 3px;
  display: inline-block;
}

.faction-typography {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--copper);
  margin-left: auto;
  text-align: right;
  flex-shrink: 0;
}

.faction-typo-label {
  font-size: 7px;
  color: var(--ink-faded);
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* EXPANDED CARD BODY */
.faction-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease, padding 0.4s ease;
  padding: 0 16px;
  border-top: 0px solid transparent;
}

.faction-card.expanded .faction-body {
  max-height: 400px;
  padding: 12px 16px 16px;
  border-top: 1px solid rgba(201,168,76,0.1);
}

.archetype-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.archetype-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  background: rgba(201,168,76,0.04);
  border-left: 2px solid var(--gold-dim);
  transition: all 0.2s;
}

.archetype-item:hover {
  background: rgba(201,168,76,0.08);
  border-left-color: var(--gold-bright);
}

.archetype-role {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  font-weight: 600;
  color: var(--parchment);
}

.archetype-class {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  color: var(--verdigris);
  letter-spacing: 0.5px;
}

.archetype-desc {
  font-family: 'Crimson Pro', serif;
  font-size: 11px;
  color: var(--ink-faded);
}

.section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  color: var(--gold-dim);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 6px;
  margin-top: 10px;
}

/* ERA STATS BAR */
.era-stats {
  display: flex;
  gap: 24px;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid rgba(201,168,76,0.1);
  flex-wrap: wrap;
}

.stat-block { text-align: center; }

.stat-num {
  font-family: 'Cinzel', serif;
  font-size: 24px;
  font-weight: 900;
  color: var(--gold-bright);
}

.stat-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  color: var(--ink-faded);
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* MINIMAP */
.minimap {
  position: fixed;
  bottom: 16px;
  right: 16px;
  background: var(--overlay);
  border: 1px solid var(--gold-dim);
  padding: 10px;
  z-index: 50;
  width: 180px;
}

.minimap-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  color: var(--gold-dim);
  letter-spacing: 2px;
  margin-bottom: 6px;
}

.minimap-bar {
  display: flex;
  height: 6px;
  gap: 2px;
  margin-bottom: 4px;
}

.minimap-seg {
  flex: 1;
  border-radius: 1px;
  cursor: pointer;
  transition: all 0.15s;
  opacity: 0.4;
}

.minimap-seg:hover { opacity: 0.7; transform: scaleY(1.5); }
.minimap-seg.active { opacity: 1; }

.minimap-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 7px;
  color: var(--ink-faded);
  text-align: center;
  margin-top: 2px;
}

/* KEYBOARD HINT */
.key-hint {
  position: fixed;
  bottom: 16px;
  left: 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--ink-faded);
  z-index: 50;
}

.key-hint kbd {
  display: inline-block;
  background: rgba(201,168,76,0.1);
  border: 1px solid var(--gold-dim);
  padding: 1px 6px;
  margin: 0 2px;
  font-size: 9px;
  color: var(--gold);
}
</style>
</head>

          { role: "Life Support Tech", cls: "Caregiver", desc: "Survival systems" },
          { role: "Space-Born Native", cls: "Innocent", desc: "First generation" }
        ]}
    ]
  }
];

// ARCHETYPE COLORS
const ARCHETYPE_COLORS = {
  Ruler: "#c9a84c", Hero: "#8b2500", Sage: "#2c7a7b", Magician: "#553c9a",
  Creator: "#b87333", Explorer: "#2b6cb0", Rebel: "#c53030", Innocent: "#68d391",
  Jester: "#d69e2e", Everyman: "#718096", Caregiver: "#ed64a6", Lover: "#e53e3e"
};

// STATE
let activeEra = 0;
let expandedCard = null;

// INIT
function init() {
  buildEraNav();
  buildMinimap();
  selectEra(0);
  setupKeys();
}

function buildEraNav() {
  const nav = document.getElementById('eraNav');
  nav.innerHTML = ERAS.map((era, i) =>
    `<button class="era-tab${i===0?' active':''}" id="etab-${i}" onclick="selectEra(${i})">
      <span class="era-tab-num">${era.num}</span>
      <span>${era.name}</span>
    </button>`
  ).join('');
}

function buildMinimap() {
  const bar = document.getElementById('minimapBar');
  bar.innerHTML = ERAS.map((era, i) =>
    `<div class="minimap-seg${i===0?' active':''}" id="mseg-${i}" style="background:${era.color}" onclick="selectEra(${i})"></div>`
  ).join('');
}

function selectEra(idx) {
  activeEra = idx;
  expandedCard = null;
  const era = ERAS[idx];

  // Nav tabs
  document.querySelectorAll('.era-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.minimap-seg').forEach((s, i) => s.classList.toggle('active', i === idx));
  document.getElementById('minimapLabel').textContent = `ERA ${era.num} · ${era.name}`;

  // DRO strip
  document.getElementById('droTimeScale').textContent = era.dro.timeScale;
  document.getElementById('droPrecision').textContent = era.dro.precision;
  document.getElementById('droFactions').textContent = era.factions.length;
  document.getElementById('droArchetypes').textContent = era.factions.reduce((s, f) => s + f.archetypes.length, 0);

  // Timeline
  updateTimeline(idx);

  // Year display
  document.getElementById('yearDisplay').textContent =
    era.yearStart < 0 ? `${Math.abs(era.yearStart)} BCE` : `${era.yearStart} CE`;

  // Content
  renderEraContent(era);
}

function updateTimeline(idx) {
  const track = document.getElementById('timelineTrack');
  // Clear old markers
  const old = track.parentElement.querySelectorAll('.timeline-marker, .timeline-era-bar');
  old.forEach(el => el.remove());

  const strip = track.parentElement;
  const trackLeft = 40;
  const trackRight = strip.clientWidth - 40;
  const totalW = trackRight - trackLeft;

  // Full timeline span: 3500 BCE to 2150 CE = 5650 years
  const absStart = -3500;
  const absEnd = 2150;
  const absSpan = absEnd - absStart;

  // Era bars
  ERAS.forEach((era, i) => {
    const bar = document.createElement('div');
    bar.className = `timeline-era-bar${i === idx ? ' active' : ''}`;
    const left = trackLeft + ((era.yearStart - absStart) / absSpan) * totalW;
    const right = trackLeft + ((era.yearEnd - absStart) / absSpan) * totalW;
    bar.style.left = left + 'px';
    bar.style.width = (right - left) + 'px';
    bar.style.background = era.color;
    strip.appendChild(bar);
  });

  // Key date markers
  const keyDates = [
    { year: -3500, label: "3500 BCE" }, { year: -3000, label: "3000 BCE" },
    { year: -2000, label: "2000 BCE" }, { year: -1000, label: "1000 BCE" },
    { year: 0, label: "1 CE" }, { year: 500, label: "500" },
    { year: 1000, label: "1000" }, { year: 1500, label: "1500" },
    { year: 1750, label: "1750" }, { year: 1900, label: "1900" },
    { year: 2000, label: "2000" }, { year: 2100, label: "2100" }
  ];

  keyDates.forEach(d => {
    const mk = document.createElement('div');
    mk.className = 'timeline-marker';
    const era = ERAS[idx];
    if (d.year >= era.yearStart && d.year <= era.yearEnd) mk.classList.add('active');
    mk.style.left = (trackLeft + ((d.year - absStart) / absSpan) * totalW) + 'px';
    mk.innerHTML = `<div class="timeline-marker-label">${d.label}</div>`;
    mk.onclick = () => {
      // Find matching era
      const match = ERAS.findIndex(e => d.year >= e.yearStart && d.year <= e.yearEnd);
      if (match >= 0) selectEra(match);
    };
    strip.appendChild(mk);
  });
}

function renderEraContent(era) {
  const area = document.getElementById('contentArea');
  const totalArchetypes = era.factions.reduce((s, f) => s + f.archetypes.length, 0);
  const uniqueClasses = [...new Set(era.factions.flatMap(f => f.archetypes.map(a => a.cls)))];

  area.innerHTML = `
    <div class="era-header">
      <div class="era-name" style="color: ${era.color}">${era.name}</div>
      <div class="era-period">${era.period}</div>
      <div class="era-theme">${era.theme}</div>
      <div class="era-dro-info">
        <div class="dro-chip">DRO: ${era.dro.precision}</div>
        <div class="dro-chip">TIME: ${era.dro.timeScale}</div>
        <div class="dro-chip">TERRAIN: ${era.dro.terrainRes}</div>
        <div class="dro-chip">FACTIONS: ${era.factions.length}</div>
        <div class="dro-chip">ROLES: ${totalArchetypes}</div>
      </div>
    </div>
    <div class="faction-grid">
      ${era.factions.map((f, i) => renderFactionCard(f, i)).join('')}
    </div>
    <div class="era-stats">
      <div class="stat-block"><div class="stat-num">${era.factions.length}</div><div class="stat-label">Factions</div></div>
      <div class="stat-block"><div class="stat-num">${totalArchetypes}</div><div class="stat-label">Roles</div></div>
      <div class="stat-block"><div class="stat-num">${uniqueClasses.length}</div><div class="stat-label">Classes</div></div>
      <div class="stat-block"><div class="stat-num">${era.dro.precision.replace('BASE-','')}</div><div class="stat-label">DRO Base</div></div>
    </div>
  `;
}

function renderFactionCard(f, idx) {
  return `
    <div class="faction-card" id="fcard-${idx}" onclick="toggleFaction(${idx})">
      <div class="faction-card-head">
        <div class="faction-icon">${f.icon}</div>
        <div class="faction-info">
          <div class="faction-name">${f.name}</div>
          <div class="faction-territory">${f.territory}</div>
          <div class="faction-bonus-tag">${f.bonus}</div>
        </div>
        <div class="faction-typography">
          <div class="faction-typo-label">TYPOGRAPHY</div>
          ${f.typography}
        </div>
      </div>
      <div class="faction-body">
        <div class="section-label">PLAYABLE ARCHETYPES</div>
        <div class="archetype-grid">
          ${f.archetypes.map(a => `
            <div class="archetype-item" style="border-left-color: ${ARCHETYPE_COLORS[a.cls] || '#888'}">
              <div>
                <div class="archetype-role">${a.role}</div>
                <div class="archetype-class" style="color: ${ARCHETYPE_COLORS[a.cls] || '#888'}">${a.cls.toUpperCase()}</div>
                <div class="archetype-desc">${a.desc}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function toggleFaction(idx) {
  const card = document.getElementById(`fcard-${idx}`);
  if (expandedCard === idx) {
    card.classList.remove('expanded');
    expandedCard = null;
  } else {
    // Close previous
    if (expandedCard !== null) {
      const prev = document.getElementById(`fcard-${expandedCard}`);
      if (prev) prev.classList.remove('expanded');
    }
    card.classList.add('expanded');
    expandedCard = idx;
  }
}

function setupKeys() {
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      selectEra(Math.min(ERAS.length - 1, activeEra + 1));
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      selectEra(Math.max(0, activeEra - 1));
    } else if (e.key >= '1' && e.key <= '7') {
      selectEra(parseInt(e.key) - 1);
    }
  });
}

// Resize handler for timeline
window.addEventListener('resize', () => updateTimeline(activeEra));

// TOTAL CIV COUNT
const totalCivs = ERAS.reduce((s, e) => s + e.factions.length, 0);
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('droCivCount').textContent = totalCivs;
});

init();
</script>
</body>
</html>
